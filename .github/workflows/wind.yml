name: wind
on:
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install eccodes numpy
      - run: python data/wind/fetch_wind.py
      - name: Check size
        run: |
          size=$(stat -c %s data/wind/gfs-wind-1deg.bin)
          [ "$size" -eq 260640 ] || { echo "bad size $size"; exit 1; }
          mkdir -p data/wind/out
          cp data/wind/gfs-wind-1deg.bin data/wind/gfs-wind-1deg.json data/wind/out/
      - run: bash .github/scripts/publish.sh wind data/wind/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

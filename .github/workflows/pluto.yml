name: pluto
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  pluto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow opencv-python-headless
      - run: python data/pluto/build_pluto.py
      - run: bash .github/scripts/publish.sh pluto data/pluto/out data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

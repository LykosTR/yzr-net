name: moons
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  moons:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow opencv-python-headless
      - run: python data/moons/build_moons.py
      - run: bash .github/scripts/publish.sh moons data/moons/out data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

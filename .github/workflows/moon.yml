name: moon
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  moon:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow opencv-python-headless
      - run: python data/moon/build_moon.py
      - run: bash .github/scripts/publish.sh moon data/moon/out data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

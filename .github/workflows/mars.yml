name: mars
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  mars:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow opencv-python-headless
      - run: python data/mars/build_mars.py
      - run: bash .github/scripts/publish.sh mars data/mars/out data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

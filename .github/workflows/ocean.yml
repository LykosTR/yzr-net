name: ocean
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  ocean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy numcodecs
      - run: python data/ocean/fetch_ocean.py
      - run: bash .github/scripts/publish.sh ocean data/ocean/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

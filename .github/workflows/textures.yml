name: textures
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  textures:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow
      - run: python data/textures/build_textures.py
      - run: bash .github/scripts/publish.sh textures data/textures/out data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

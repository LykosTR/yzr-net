name: bodies
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  bodies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data/bodies/fetch_bodies.py
      - run: bash .github/scripts/publish.sh bodies data/bodies/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
